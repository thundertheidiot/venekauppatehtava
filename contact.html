<!doctype html>
<html lang="fi">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Merivaara - Ota yhteyttä</title>
		<link rel="stylesheet" href="style.css">

		<script src="contact.js" defer></script>
	</head>
	<body>
		<header class="bar">
			<a href="index.html">Merivaara</a>

			<nav class="valikko">
				<a href="index.html">Etusivu</a>
				<a href="contact.html" aria-current="page">Ota yhteyttä</a>
			</nav>
		</header>

		<main>
			<section class="contact">
				<h1>Ota yhteyttä meihin!</h1>

				<form class="contact-form" method="post" action="https://httpbin.org">
					<div class="form-item">
						<label for="name">Nimi</label>
						<input type="text" id="name" name="name" required>
						<span class="form-error">Nimi on pakollinen!</span>
					</div>

					<div class="form-item">
						<label for="email">Sähköposti</label>
						<input type="email" id="email" name="email" required>
						<span class="form-error">Sähköpostiosoite on pakollinen!</span>
					</div>

					<div class="form-item">
						<label for="phone">Puhelinnumero</label>
						<input type="tel" id="phone" name="phone">
					</div>

					<div class="form-item">
						<label for="boat-selector">Kiinnostava vene?</label>
						<select id="boat-selector" name="boat" required>
							<option value="">Valitse vene</option>
							<option value="ykkosvene">Ykkösvene</option>
							<option value="kakkosvene">Kakkosvene</option>
							<option value="kolmosvene">Kolmosvene</option>
						</select>
						<span class="form-error">Vene on pakollinen!</span>
					</div>

					<div class="form-item">
						<label for="message">Viesti</label>
						<textarea
							id="message"
							name="message"
							required
							minlength="5"
						></textarea>
						<span class="form-error">Viesti on pakollinen!</span>
					</div>

					<input type="submit" value="Lähetä" class="button">
				</form>
			</section>
		</main>

		<footer class="bar">
			<div class="footer-contact-info">
				<h3>Merivaara Oy</h3>
				<p>hei@merivaara.fi · 09 123 4567</p>
				<p>Ma–pe klo 9–16 · Helsinki, Suomi</p>
			</div>
			<div>
				<p>&copy; 2026 Merivaara Oy</p>
			</div>
		</footer>
	</body>
</html>
