<!doctype html>
<html lang="fi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venekauppa</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="bar">
    <a href="index.html">Matkailuyritys</a>

    <nav class="valikko">
      <a href="index.html" aria-current="page">Etusivu</a>
      <a href="contact.html">Ota yhteyttä</a>
    </nav>
  </header>

  <main>

    <section class="hero">
      <div class="hero-content">

        <h1>Parhaat veneet</h1>

        <p></p>

      </div>
    </section>

    <h2>Löydä yhteinen lomakohde</h2>
    <p>Tutustu parhaisiin veneisiin alla!</p>

    <section class="boat-cards-section">
      <div class="boat-cards">
        <div class="boat-card">
          <img src="images/frontofboat.jpg" alt="Kuva veneen etuosasta" class="card-image">
          <h3>Maailman paras vene</h3>
          <ul class="card-details">
            <li>Nimi: Ykkösvene</li>
            <li>Hinta: 2000€</li>
          </ul>            
        </div>
        <div class="boat-card">
          <img src="images/backofboat.jpg" alt="Kuva veneen takaosasta" class="card-image">
          <h3>Galaxin paras vene</h3>
          <ul class="card-details">
            <li>Nimi: Kakkosvene</li>
            <li>Hinta: 5000€</li>
          </ul>            
        </div>
        <div class="boat-card">
          <img src="images/boatinwater.jpg" alt="Kuva veneestä vedessä" class="card-image">
          <h3>Universumin paras vene</h3>
          <ul class="card-details">
            <li>Nimi: Kolmosvene</li>
            <li>Hinta: 10000€</li>
          </ul>            
        </div>
      </div>
    </section>
  </main>

  <footer class="bar"></footer>
